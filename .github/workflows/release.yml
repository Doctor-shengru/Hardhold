name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.3）；留空则只产出 artifact，不建 Release'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${{ github.ref_name }}"
          fi
          VERSION="${REF#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "无法从 '$REF' 解析版本号（期望 v1.2 这种格式）"; exit 1
          fi
          # versionCode 用递增的构建号，避免 1.10 与 1.1 冲突
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（versionCode ${{ github.run_number }}）"

      - name: 准备构建工具
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          BT="$SDK/build-tools/34.0.0"
          JAR="$SDK/platforms/android-34/android.jar"
          if [ ! -x "$BT/aapt" ] || [ ! -f "$JAR" ]; then
            echo "预装 SDK 缺 build-tools 34 / platform 34，改用 setup.sh 下载"
            MIRROR=https://dl.google.com/android/repository ./setup.sh
            BT="$PWD/tools/android-14"
            JAR="$PWD/tools/android-34/android.jar"
          fi
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$JAR" >> "$GITHUB_ENV"
          "$BT/aapt" version

      - name: 拉取依赖
        run: python3 fetch-deps.py

      - name: 还原签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p secrets
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > secrets/release.keystore
            echo "临时密钥：否（用仓库 secrets 里的正式密钥）"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没有配置 KEYSTORE_BASE64，本次使用临时签名密钥，装过旧版的手机会签名冲突"
            echo "临时密钥：是"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          KEYSTORE: ${{ steps.signing.outputs.ephemeral == 'false' && 'secrets/release.keystore' || 'secrets/temp.keystore' }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'hardhold' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
        run: ./build.sh

      - name: 改名 + 校验和
        id: pack
        run: |
          V="${{ steps.ver.outputs.version }}"
          mv hardhold.apk "hardhold-v$V.apk"
          sha256sum "hardhold-v$V.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "apk=hardhold-v$V.apk" >> "$GITHUB_OUTPUT"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardhold-apk
          path: |
            hardhold-v*.apk
            SHA256SUMS.txt

      - name: 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        run: |
          V="${{ steps.ver.outputs.version }}"
          {
            echo "## 硬撑 v$V"
            echo
            echo "从 commit \`${{ github.sha }}\` 自动构建。"
            echo
            echo "### 安装"
            echo "1. 下载下面的 APK"
            echo "2. 点击安装，允许「未知来源」"
            echo "3. 同意摄像头权限，把全身放进画面"
            echo
            echo "### 校验"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            if [ "${{ steps.signing.outputs.ephemeral }}" = "true" ]; then
              echo "> 本次使用**临时签名密钥**，与上一版签名不一致；若提示签名冲突，请先卸载旧版再安装。"
            else
              echo "> 使用仓库 secrets 中的固定密钥签名，可直接覆盖升级。"
            fi
            echo
            echo "**仅本机推理，不联网、不上传画面。**"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "v$V" "hardhold-v$V.apk" SHA256SUMS.txt \
            --title "硬撑 v$V" \
            --notes-file RELEASE_NOTES.md
